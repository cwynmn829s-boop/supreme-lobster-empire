<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>至尊龙虾帝国</title>
    <style>
        body { margin: 0; background: #1c1c1e; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; text-align: center; }
        .accent { color: #007aff; }
        .ball-screw { width: 100px; height: 20px; background: #333; margin: 20px auto; border-radius: 10px; box-shadow: 0 0 10px #007aff; }
    </style>
</head>
<body>
    <div class="glass">
        <h1>至尊龙虾帝国 <span class="accent">Dashboard</span></h1>
        <div class="ball-screw"></div>
        <p>高性能物流队列与指挥中心</p>
    </div>
</body>
</html>
